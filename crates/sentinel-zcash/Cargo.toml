[package]
name = "sentinel-zcash"
version = "0.1.0"
edition = "2021"

[lib]
name = "sentinel_zcash"
path = "src/lib.rs"

[[bin]]
name = "sentinel-zcash"
path = "src/main.rs"

[dependencies]
orchard = "0.16"
zcash_primitives = "0.31"
zcash_keys = "0.17"
zcash_protocol = "0.11"
zcash_address = "0.14"
zip32 = "0.3"
pczt = "0.10"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.33", features = ["bundled"] }
bip39 = { version = "2.2" }
rand = "0.10"
rand_core = "0.10"
hex = "0.4"
tower-http = { version = "0.6", features = ["cors", "trace"] }
anyhow = "1.0"
thiserror = "2.0"
bech32 = "0.11"
subtle = "2.6"
reddsa = "0.6"
chrono = { version = "0.4", features = ["serde"] }
pasta_curves = "0.6"
blake2b_simd = "1.0"
